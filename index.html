async function exportJSON(txt){let c=null;try{c=window.claude&&await claude.use('downloads')}catch(e){}
if(c){try{await c.save({filename:'momiji-backup.json',data:txt});return}catch(e){if(e&&e.code==='declined')return}}
try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download='momiji-backup.json';document.body.appendChild(a);a.click();a.remove()}catch(e){}

/* 匯入驗證：全部欄位通過才套用；任何錯誤都不改動現有資料 */
function validateImport(j){const o=x=>x&&typeof x==='object'&&!Array.isArray(x),R={};
if(!o(j))return'內容不是備份物件';
for(const k of ['done','notes','pack','exp','gift']){if(j[k]===undefined)continue;const v=j[k];let ok;
if(k==='done'||k==='pack')ok=o(v)&&Object.values(v).every(x=>typeof x==='boolean');
else if(k==='notes')ok=o(v)&&Object.values(v).every(x=>typeof x==='string');
else if(k==='exp')ok=Array.isArray(v)&&v.every(e=>o(e)&&typeof e.n==='string'&&typeof e.amt==='number'&&isFinite(e.amt));
else ok=Array.isArray(v)&&v.every(g=>o(g)&&typeof g.n==='string'&&typeof g.d==='boolean');
if(!ok)return'欄位「'+k+'」格式不正確';R[k]=v}
if(j.guide!==undefined){const v=j.guide;if(!(o(v)&&(v.done===undefined||(o(v.done)&&Object.values(v.done).every(x=>typeof x==='boolean')))&&(v.term===undefined||v.term===''||v.term==='1'||v.term==='2')))return'欄位「guide」格式不正確';R.guide=v}
return Object.keys(R).length?R:'找不到可匯入的欄位'}

const v=validateImport(j);if(typeof v==='string'){alert('匯入失敗：'+v+'，原有資料未變動');return}

function hotPanel(id){const h=HOT.find(x=>x.id===id);if(!h)return'<p class="note">點選地圖標牌或下方清單，查看該區域的景點卡片。</p>';
return`<h3>${h.n}</h3><p class="note">${h.area?'區域熱點：下列為此區域相關項目，插畫不代表精確位置。':'插畫地圖僅示意，實際位置請以 Google Maps 為準。'}</p>`+h.t.map(i=>{const{d,a}=ACT[i],[l,c]=ST[a.st];return`<div class="act" style="--dc:${d.c};animation:none"><div class="ah" style="cursor:default"><div class="t"><b>${esc(a.zh)}</b><br><small>${esc(a.ja)}</small><div><span class="tag ${c}">${l}</span><small>Day ${d.id}｜${a.t?esc(a.t):'時間待確認'}</small></div><small>${esc(a.stay)}｜${esc(a.tr)}</small></div></div><div class="row" style="padding:0 12px 12px"><button data-hgo="${i}">前往 Day ${d.id} 行程</button><a class="btn pri" href="${maps(a.q)}" target="_blank" rel="noopener">🗺 Google Maps</a></div></div>`}).join('')}
function mapView(){const[u,,alt,w,h]=IMG.map;
const hs=HOT.map(o=>{const[x,y,rw,rh]=o.r,pos=`left:${x/MW*100}%;top:${y/MH*100}%;width:${rw/MW*100}%;height:${rh/MH*100}%`;
if(!o.t.length)return`<span class="hs st" style="${pos}">${o.n}</span>`;
const on=hdays(o).includes(S.day);return`<button class="hs ${on?'on':'dim'} ${S.hot===o.id?'sel':''}" style="${pos}" data-hot="${o.id}" aria-label="${o.n}，Day ${hdays(o).join('、')}">${o.n}</button>`}).join('');
return`<div class="tabs">${TRIP.days.map(x=>`<button class="${x.id===S.day?'on':''}" style="--c:${x.c}" data-day="${x.id}">Day ${x.id}</button>`).join('')}</div>

<div id="mapf" class="mapf" role="group" aria-label="關西故事地圖"><div id="mapt" class="mapt"><img src="${u}" width="${w}" height="${h}" alt="${alt}" decoding="async" draggable="false">${hs}</div></div>
<div class="row"><button data-zm="1" aria-label="放大">＋</button><button data-zm="-1" aria-label="縮小">－</button><button data-zm="0">重設</button></div>

<div class="card">${hotPanel(S.hot)}</div>
<div class="grid">${HOT.map(o=>o.t.length?`<button class="hl" data-hot="${o.id}"><b>${o.n}</b><small>Day ${hdays(o).join('、')}</small></button>`:`<button class="hl" disabled><b>${o.n}</b><small>尚未對應行程</small></button>`).join('')}</div>`}
let M={s:1,x:0,y:0},PT=new Map(),G=null,SUP=false;
const mf=()=>document.getElementById('mapf');
function mapApply(){const f=mf(),t=document.getElementById('mapt');if(!f||!t)return;const w=f.clientWidth,h=f.clientHeight;M.s=Math.min(4,Math.max(1,M.s));M.x=Math.min(0,Math.max(w*(1-M.s),M.x));M.y=Math.min(0,Math.max(h*(1-M.s),M.y));t.style.transform='translate('+M.x+'px,'+M.y+'px) scale('+M.s+')';f.style.touchAction=M.s>1?'none':'pan-y'}
function mapInit(){mapApply()}
function zoomAt(cx,cy,ns){ns=Math.min(4,Math.max(1,ns));M.x=cx-(cx-M.x)*ns/M.s;M.y=cy-(cy-M.y)*ns/M.s;M.s=ns;mapApply()}
document.addEventListener('pointerdown',e=>{if(!(e.target.closest&&e.target.closest('#mapf')))return;SUP=false;PT.set(e.pointerId,{x:e.clientX,y:e.clientY});
if(PT.size===2){const[a,b]=[...PT.values()];G={d:Math.hypot(a.x-b.x,a.y-b.y)||1,s:M.s,moved:1}}else if(PT.size===1)G={sx:e.clientX,sy:e.clientY,ox:M.x,oy:M.y,moved:0}});
document.addEventListener('pointermove',e=>{if(!PT.has(e.pointerId)||!G)return;PT.set(e.pointerId,{x:e.clientX,y:e.clientY});const f=mf();if(!f)return;
if(PT.size===2){const[a,b]=[...PT.values()],r=f.getBoundingClientRect();zoomAt((a.x+b.x)/2-r.left,(a.y+b.y)/2-r.top,G.s*Math.hypot(a.x-b.x,a.y-b.y)/G.d);return}
const dx=e.clientX-G.sx,dy=e.clientY-G.sy;if(!G.moved&&M.s>1&&Math.hypot(dx,dy)>6){G.moved=1;try{f.setPointerCapture(e.pointerId)}catch(x){}}
if(G.moved){M.x=G.ox+dx;M.y=G.oy+dy;mapApply()}});
const pend=e=>{if(!PT.has(e.pointerId))return;PT.delete(e.pointerId);if(G&&G.moved)SUP=true;if(PT.size===1){const p=[...PT.values()][0];G={sx:p.x,sy:p.y,ox:M.x,oy:M.y,moved:1}}else G=null};
document.addEventListener('pointerup',pend);document.addEventListener('pointercancel',pend);
document.addEventListener('click',e=>{if(SUP&&e.target.closest&&e.target.closest('#mapf')){e.stopPropagation();e.preventDefault();SUP=false}},true);
document.addEventListener('wheel',e=>{const f=e.target.closest&&e.target.closest('#mapf');if(!f||!(e.ctrlKey||e.metaKey))return;e.preventDefault();const r=f.getBoundingClientRect();zoomAt(e.clientX-r.left,e.clientY-r.top,M.s*(e.deltaY<0?1.15:1/1.15))},{passive:false});
window.addEventListener('resize',mapApply);
document.addEventListener('click',e=>{let x;
if(x=e.target.closest('[data-hot]')){const id=x.dataset.hot;S.hot=id;render();const el=document.querySelector('.hs[data-hot="'+id+'"]');if(el)el.focus({preventScroll:true});const c=document.querySelector('#app .card');if(c)c.scrollIntoView({block:'nearest'})}
else if(x=e.target.closest('[data-hgo]')){const i=x.dataset.hgo;S.day=ACT[i].d.id;S.tab='plan';S.open=i;render();setTimeout(()=>{const el=document.querySelector('[data-open="'+i+'"]');if(el)el.scrollIntoView({block:'center'})},50)}
else if(x=e.target.closest('[data-zm]')){const f=mf();if(!f)return;const v=+x.dataset.zm;if(!v){M={s:1,x:0,y:0};mapApply()}else zoomAt(f.clientWidth/2,f.clientHeight/2,M.s*(v>0?1.5:1/1.5))}});
document.addEventListener('error',e=>{if(e.target&&e.target.tagName==='IMG')e.target.alt+='（圖片載入失敗，請檢查網路後重新整理）'},true);

const TAXZ=[
['購物時的實際流程','<ol><li>找有免稅標示的免稅店（不是每家都能退稅）。</li><li>結帳前拿出護照。</li><li>店家電子登錄你的購買資料。</li><li>付含稅價。</li><li>依店家指示登錄退款方式。</li><li>保存收據與商品，不拆封使用。</li></ol><p>來源：日本海關、觀光廳。</p>'],
['護照與身分確認','<p>外國旅客的基本做法是在店內出示護照。誰符合免稅購買資格、店內要出示什麼文件，以觀光廳的「旅客適用對象清單」為準（見下方連結）。Visit Japan Web 的免稅購物功能是否被店家接受，由店家決定，建議仍隨身帶護照。</p><p>來源：觀光廳（新制說明）。</p>'],
['退款方式由誰決定','<p>退款由免稅店或它委託的業者處理，不是海關發錢；提供哪些方式由店家或業者決定，你在購物時依店家說明登錄。觀光廳 FAQ 列出的方式有銀行轉帳、信用卡、App，或海關確認後在出境口岸領現金，各店不同，不要假設一樣；如何登錄由店家或業者在購物時說明。退款一般在海關確認之後辦理，何時入帳請問店家。</p><p>來源：觀光廳 FAQ。</p>'],
['哪些情況可能無法退稅','<ul><li>同店同日未稅合計未滿 5,000 日圓。</li><li>商品在日本使用、吃掉或用掉。</li><li>同一張收據（同一筆購買記錄）裡有任何一項沒帶在身上，整筆都可能無法確認（觀光廳資料）。</li><li>超過購買日起 90 天，或沒有完成出境時的海關確認。</li><li>數量超過你能隨身帶出日本的範圍。</li><li>金、白金條等排除項目。</li><li>先托運才辦手續（托運後無法取回）。</li><li>已在日本吃掉部分消耗品卻照常辦手續：請不要在終端機辦，改向海關櫃台報告。</li></ul><p>來源：日本海關、觀光廳。</p>'],
['回程機場操作步驟','<ol><li>抵達機場，先不要排托運。</li><li>在國際線出境大廳的「免稅手續終端機」掃護照；關西、成田、羽田、中部、福岡、新千歲、那霸另可用 Visit Japan Web 連專用 Wi-Fi（安檢前，需事先設定好）。</li><li>看結果：綠色＝完成；紅色＝帶商品去海關檢查區。</li><li>完成後才去航空公司報到托運。</li></ol><p>關西機場：第一航廈 4 樓有終端機 12 台、檢查區與專用 Wi-Fi 區；第二航廈在報到大廳有終端機 4 台。其他機場位置依各機場公告。來源：大阪稅關關西機場指南。</p>'],
['退稅商品放在托運行李怎麼辦','<p>觀光廳 FAQ：行李一旦托運就無法取回；辦手續必須先在終端機掃護照，且身上要帶著全部免稅商品，所以托運後就無法完成手續（即使事後出現紅色結果也一樣）。</p><p>手續完成後，商品仍須由你帶出日本；是否可放進托運行李，請依現場海關或航空公司的指示。</p><p>如果已經托運：立刻詢問航空公司櫃台與機場海關人員，但不要預期一定能補辦，補辦不了就可能拿不到退稅。</p><p>來源：觀光廳 FAQ。</p>'],
['海關要求人工查驗時','<p>終端機顯示紅色時，把免稅商品與護照帶到指定的海關檢查區，商品要未使用、可出示。依人員指示檢查，完成後再報到。排隊需要時間，請預留空檔。</p><p>單價 100 萬日圓以上（未稅）的商品，海關可能要求出示保證書或鑑定書，先準備好會比較順利。海關確認（含查驗）要在登機手續前完成；時間不夠而放棄查驗，視為未完成，航空公司與海關都不會補償。</p><p>來源：日本海關、大阪稅關關西機場指南。</p>'],
['退款沒有入帳要問誰','<p>先找你購物時拿到的收據、電子郵件或退款登錄頁；退款由店家或其退款業者辦理，請先聯絡他們，並準備收據、護照姓名、購買日與機場確認日期。海關只負責確認商品出境，不負責退款。官方沒有統一入帳日期。</p><p>來源：觀光廳、國稅廳。</p>']];

document.addEventListener('click',e=>{if(e.target.closest('[data-gcopy]')||e.target.closest('[data-gsel]')){const ta=document.getElementById('gct'),m=document.getElementById('gcm');if(!ta)return;const t=cheatText();ta.value=t;ta.style.display='block';const fb=()=>{ta.focus();ta.select();m.textContent='無法自動複製，請長按文字框全選後複製。'};if(e.target.closest('[data-gsel]')){ta.focus();ta.select();m.textContent='已全選，請複製。';return}
try{navigator.clipboard.writeText(t).then(()=>{m.textContent='已複製（共 '+t.length+' 字）'},fb)}catch(er){fb()}}});
